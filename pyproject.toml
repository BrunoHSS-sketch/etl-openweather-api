[project]
name = "etl-openweather-api"
version = "0.1.3"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Bruno.S", email = "brunoschmitthenrique@gmail.com" }
]
requires-python = ">=3.8"
dependencies = [
    "loguru>=0.7.3",
    "pandas>=2.0.3",
    "psycopg2-binary>=2.9.10",
    "pyarrow>=17.0.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.4",
    "sqlalchemy>=2.0.55",
]

[tool.uv]
package = false


[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]
